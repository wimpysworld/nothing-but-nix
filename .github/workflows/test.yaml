name: Test 🧪
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determinate-nix-action:
    name: determinate-nix-action (${{ matrix.hatchet-protocol }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        hatchet-protocol: [holster, carve, cleave, rampage]
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ./.github/actions/this
      - name: Purge
        uses: ./.github/actions/this
        with:
          hatchet-protocol: ${{ matrix.hatchet-protocol }}
          witness-carnage: true
      - name: Check TMPDIR
        run: |
          if [[ -z "${TMPDIR:-}" ]]; then
            echo "::error::TMPDIR is not set"
            exit 1
          fi
          if ! tmpdir_real="$(realpath -e "${TMPDIR}")"; then
            echo "::error::TMPDIR (${TMPDIR}) does not exist"
            exit 1
          fi
          case "${tmpdir_real}" in
            /nix|/nix/*)
              echo "::error::TMPDIR (${tmpdir_real}) must stay outside /nix because the Nix multi-user installer runs chown -R root:nixbld /nix (#57)"
              exit 1
              ;;
          esac
          if [[ ! -d "${tmpdir_real}" || ! -w "${tmpdir_real}" ]]; then
            echo "::error::TMPDIR (${tmpdir_real}) is not a directory that $(id --user --name) can write to"
            exit 1
          fi
          echo "TMPDIR is ${tmpdir_real}"
      - uses: DeterminateSystems/determinate-nix-action@main
      - name: Nix
        run: |
          nix --version
          echo "Hello Nix" | nix run "https://flakehub.com/f/NixOS/nixpkgs/*#neo-cowsay"
          # Build a package to ensure the Nix store is functional
          nix build "https://flakehub.com/f/NixOS/nixpkgs/*#hello"
  nix-quick-install:
    name: nix-quick-action (${{ matrix.hatchet-protocol }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        hatchet-protocol: [holster, carve, cleave, rampage]
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ./.github/actions/this
      - name: Purge
        uses: ./.github/actions/this
        with:
          hatchet-protocol: ${{ matrix.hatchet-protocol }}
          witness-carnage: true
          nix-permission-edict: true
      - name: Check TMPDIR
        run: |
          if [[ -z "${TMPDIR:-}" ]]; then
            echo "::error::TMPDIR is not set"
            exit 1
          fi
          if ! tmpdir_real="$(realpath -e "${TMPDIR}")"; then
            echo "::error::TMPDIR (${TMPDIR}) does not exist"
            exit 1
          fi
          case "${tmpdir_real}" in
            /nix|/nix/*)
              echo "::error::TMPDIR (${tmpdir_real}) must stay outside /nix because the Nix multi-user installer runs chown -R root:nixbld /nix (#57)"
              exit 1
              ;;
          esac
          if [[ ! -d "${tmpdir_real}" || ! -w "${tmpdir_real}" ]]; then
            echo "::error::TMPDIR (${tmpdir_real}) is not a directory that $(id --user --name) can write to"
            exit 1
          fi
          echo "TMPDIR is ${tmpdir_real}"
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Nix
        run: |
          nix --version
          echo "Hello Nix" | nix run "nixpkgs#neo-cowsay"
          # Build a package to ensure the Nix store is functional
          nix build "nixpkgs#hello"
  cachix-nix-action:
    name: cachix-nix-action (${{ matrix.hatchet-protocol }}, edict ${{ matrix.nix-permission-edict }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        hatchet-protocol: [holster, carve, cleave, rampage]
        nix-permission-edict: [true, false]
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ./.github/actions/this
      - name: Purge
        uses: ./.github/actions/this
        with:
          hatchet-protocol: ${{ matrix.hatchet-protocol }}
          witness-carnage: true
          nix-permission-edict: ${{ matrix.nix-permission-edict }}
      - name: Check TMPDIR
        run: |
          if [[ -z "${TMPDIR:-}" ]]; then
            echo "::error::TMPDIR is not set"
            exit 1
          fi
          if ! tmpdir_real="$(realpath -e "${TMPDIR}")"; then
            echo "::error::TMPDIR (${TMPDIR}) does not exist"
            exit 1
          fi
          case "${tmpdir_real}" in
            /nix|/nix/*)
              echo "::error::TMPDIR (${tmpdir_real}) must stay outside /nix because the Nix multi-user installer runs chown -R root:nixbld /nix (#57)"
              exit 1
              ;;
          esac
          if [[ ! -d "${tmpdir_real}" || ! -w "${tmpdir_real}" ]]; then
            echo "::error::TMPDIR (${tmpdir_real}) is not a directory that $(id --user --name) can write to"
            exit 1
          fi
          echo "TMPDIR is ${tmpdir_real}"
      - uses: cachix/install-nix-action@v31
      - name: Nix
        run: |
          nix --version
          echo "Hello Nix" | nix run "nixpkgs#neo-cowsay"
          # Build a package to ensure the Nix store is functional
          nix build "nixpkgs#hello"
  gate:
    name: gate
    if: always()
    needs: [determinate-nix-action, nix-quick-install, cachix-nix-action]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "${NEEDS}"
          if ! jq -e 'all(.[]; .result == "success")' <<< "${NEEDS}" > /dev/null; then
            echo "::error::One or more test jobs did not succeed"
            exit 1
          fi
