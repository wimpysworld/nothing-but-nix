name: Test 🧪
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Thursday, after runner-images publishes new images early in the week
    - cron: '0 6 * * 4'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determinate-nix-action:
    name: determinate-nix-action (${{ matrix.hatchet-protocol }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm, ubuntu-26.04-arm]
        hatchet-protocol: [holster, carve, cleave, rampage]
        # Mount with a negative zstd level, which needs kernel 6.15 or later
        include:
          - os: ubuntu-26.04
            hatchet-protocol: holster
            btrfs-compression: 'zstd:-1'
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ./.github/actions/this
      - name: Purge
        uses: ./.github/actions/this
        with:
          hatchet-protocol: ${{ matrix.hatchet-protocol }}
          witness-carnage: true
          btrfs-compression: ${{ matrix.btrfs-compression || 'zstd:1' }}
      - name: Check TMPDIR
        run: bash ./.github/actions/this/.github/scripts/check-tmpdir.sh
      - name: Check /nix volume
        env:
          HATCHET_PROTOCOL: ${{ matrix.hatchet-protocol }}
        run: bash ./.github/actions/this/.github/scripts/check-nix-volume.sh "${HATCHET_PROTOCOL}"
      - name: Check Btrfs compression
        if: matrix.btrfs-compression
        env:
          BTRFS_COMPRESSION: ${{ matrix.btrfs-compression }}
        run: |
          mount_opts="$(findmnt --noheadings --output OPTIONS --mountpoint /nix)"
          echo "Mount options of /nix: ${mount_opts}"
          if ! tr ',' '\n' <<< "${mount_opts}" | grep -qxF "compress=${BTRFS_COMPRESSION}"; then
            echo "::error::/nix is not mounted with compress=${BTRFS_COMPRESSION}"
            exit 1
          fi
      - uses: DeterminateSystems/determinate-nix-action@main
      - name: Nix
        run: |
          nix --version
          echo "Hello Nix" | nix run "https://flakehub.com/f/NixOS/nixpkgs/*#neo-cowsay"
          # Build a package to ensure the Nix store is functional
          nix build "https://flakehub.com/f/NixOS/nixpkgs/*#hello"
      - name: Measure the compression of /nix
        env:
          HATCHET_PROTOCOL: ${{ matrix.hatchet-protocol }}
          BTRFS_COMPRESSION: ${{ matrix.btrfs-compression || 'zstd:1' }}
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          # compsize reads Btrfs extents through an ioctl that needs root, so
          # build it as the runner user and run it with sudo. Warn and carry
          # on when it cannot run.
          if ! compsize_out="$(nix build --no-link --print-out-paths "https://flakehub.com/f/NixOS/nixpkgs/*#compsize")"; then
            echo "::warning::Could not build compsize, so the compression of /nix is not measured"
            exit 0
          fi
          if ! report="$(sudo "${compsize_out}/bin/compsize" -x /nix)"; then
            echo "::warning::compsize could not read /nix, so the compression of /nix is not measured"
            exit 0
          fi
          echo "${report}"
          read -r perc disk_usage uncompressed _ < <(awk '$1 == "TOTAL" { print $2, $3, $4 }' <<< "${report}") || true
          if [[ -z "${uncompressed:-}" ]]; then
            echo "::warning::compsize printed no TOTAL line for /nix"
            exit 0
          fi
          echo "compsize /nix (${HATCHET_PROTOCOL}, ${BTRFS_COMPRESSION}, ${RUNNER_LABEL}): disk usage ${disk_usage}, uncompressed ${uncompressed}, ${perc} of the uncompressed size" >> "${GITHUB_STEP_SUMMARY}"
  nix-quick-install:
    name: nix-quick-action (${{ matrix.hatchet-protocol }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        hatchet-protocol: [holster, carve, cleave, rampage]
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ./.github/actions/this
      - name: Purge
        uses: ./.github/actions/this
        with:
          hatchet-protocol: ${{ matrix.hatchet-protocol }}
          witness-carnage: true
          nix-permission-edict: true
      - name: Check TMPDIR
        run: bash ./.github/actions/this/.github/scripts/check-tmpdir.sh
      - name: Check /nix volume
        env:
          HATCHET_PROTOCOL: ${{ matrix.hatchet-protocol }}
        run: bash ./.github/actions/this/.github/scripts/check-nix-volume.sh "${HATCHET_PROTOCOL}"
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Nix
        run: |
          nix --version
          echo "Hello Nix" | nix run "nixpkgs#neo-cowsay"
          # Build a package to ensure the Nix store is functional
          nix build "nixpkgs#hello"
  cachix-nix-action:
    name: cachix-nix-action (${{ matrix.hatchet-protocol }}, edict ${{ matrix.nix-permission-edict }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        hatchet-protocol: [holster, carve, cleave, rampage]
        nix-permission-edict: [true, false]
        # The multi-user installer runs `chown -R root:nixbld /nix` (#57), so
        # test it on arm64 too. One protocol is enough for that check.
        include:
          - os: ubuntu-24.04-arm
            hatchet-protocol: holster
            nix-permission-edict: true
          - os: ubuntu-24.04-arm
            hatchet-protocol: holster
            nix-permission-edict: false
          - os: ubuntu-26.04-arm
            hatchet-protocol: holster
            nix-permission-edict: true
          - os: ubuntu-26.04-arm
            hatchet-protocol: holster
            nix-permission-edict: false
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ./.github/actions/this
      - name: Purge
        uses: ./.github/actions/this
        with:
          hatchet-protocol: ${{ matrix.hatchet-protocol }}
          witness-carnage: true
          nix-permission-edict: ${{ matrix.nix-permission-edict }}
      - name: Check TMPDIR
        run: bash ./.github/actions/this/.github/scripts/check-tmpdir.sh
      - name: Check /nix volume
        env:
          HATCHET_PROTOCOL: ${{ matrix.hatchet-protocol }}
        run: bash ./.github/actions/this/.github/scripts/check-nix-volume.sh "${HATCHET_PROTOCOL}"
      - uses: cachix/install-nix-action@v31
      - name: Nix
        run: |
          nix --version
          echo "Hello Nix" | nix run "nixpkgs#neo-cowsay"
          # Build a package to ensure the Nix store is functional
          nix build "nixpkgs#hello"
  background-purge:
    name: background purge (${{ matrix.hatchet-protocol }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        hatchet-protocol: [carve, cleave, rampage]
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ./.github/actions/this
      - name: Purge
        uses: ./.github/actions/this
        with:
          hatchet-protocol: ${{ matrix.hatchet-protocol }}
          witness-carnage: false
      - name: Check TMPDIR
        run: bash ./.github/actions/this/.github/scripts/check-tmpdir.sh
      - uses: DeterminateSystems/determinate-nix-action@main
      - name: Nix
        run: |
          nix --version
          # Build a package whilst the purge runs in the background
          nix build "https://flakehub.com/f/NixOS/nixpkgs/*#hello"
      - name: Wait for the background purge
        timeout-minutes: 11
        run: |
          expansion_dir="${HOME}/.expansion"
          # The purge writes purge_seconds when it exits, after all_done on
          # success. Check every 5 seconds for at most 10 minutes.
          for _ in $(seq 1 120); do
            if [[ -s "${expansion_dir}/purge_seconds" ]]; then
              if [[ -e "${expansion_dir}/all_done" ]]; then
                echo "The background purge finished in $(cat "${expansion_dir}/purge_seconds") seconds"
                exit 0
              fi
              echo "::error::The background purge failed"
              cat "${expansion_dir}/expansion.log"
              exit 1
            fi
            sleep 5
          done
          echo "::error::The background purge did not finish within 10 minutes"
          cat "${expansion_dir}/expansion.log"
          exit 1
      - name: Check /nix volume
        env:
          HATCHET_PROTOCOL: ${{ matrix.hatchet-protocol }}
        run: bash ./.github/actions/this/.github/scripts/check-nix-volume.sh "${HATCHET_PROTOCOL}"
  ubuntu-slim:
    name: unsupported container runner on ubuntu-slim
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ./.github/actions/this
      - name: Purge
        id: purge
        uses: ./.github/actions/this
        with:
          witness-carnage: true
      - name: Check that the workflow continues
        env:
          NIX_SIZE_BYTES: ${{ steps.purge.outputs.nix-size-bytes }}
          ROOT_FREE_BYTES: ${{ steps.purge.outputs.root-free-bytes }}
        run: |
          if [[ -n "${NIX_SIZE_BYTES}" || -n "${ROOT_FREE_BYTES}" ]]; then
            echo "::error::The action did not skip on ubuntu-slim, because its outputs are not empty"
            exit 1
          fi
          fstype="$(findmnt -n -o FSTYPE --mountpoint /nix 2>/dev/null | tail -n 1 || true)"
          if [[ "${fstype}" == "btrfs" ]]; then
            echo "::error::/nix is a Btrfs mount on ubuntu-slim, so the action did not skip"
            exit 1
          fi
          echo "The action skipped on ubuntu-slim and the workflow continues"
  unsupported-os:
    name: unsupported runner on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ./.github/actions/this
      - name: Purge
        id: purge
        uses: ./.github/actions/this
        with:
          hatchet-protocol: cleave
      - name: Check that the workflow continues
        shell: bash
        env:
          NIX_SIZE_BYTES: ${{ steps.purge.outputs.nix-size-bytes }}
          ROOT_FREE_BYTES: ${{ steps.purge.outputs.root-free-bytes }}
        run: |
          if [[ -n "${NIX_SIZE_BYTES}" || -n "${ROOT_FREE_BYTES}" ]]; then
            echo "::error::The action did not skip on ${RUNNER_OS}, because its outputs are not empty"
            exit 1
          fi
          # Nix is not installed yet, so /nix exists only if the action ran
          if [[ -e /nix ]]; then
            echo "::error::/nix exists on ${RUNNER_OS} before Nix is installed, so the action did not skip"
            exit 1
          fi
          echo "The action skipped on ${RUNNER_OS} and the workflow continues"
      - uses: DeterminateSystems/determinate-nix-action@main
        if: runner.os == 'macOS'
      - name: Nix
        if: runner.os == 'macOS'
        run: |
          nix --version
          echo "Hello from macOS" | nix run "https://flakehub.com/f/NixOS/nixpkgs/*#neo-cowsay"
  # Measure the disk layout of the macOS runners. This job is temporary, so it
  # is not in the needs of sentinel and must never block a merge. It deletes
  # only in the timing steps.
  macos-survey:
    name: macos survey (${{ matrix.deleter }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      matrix:
        # xcode-27 is the macOS 27 preview image until GitHub adds macos-27.
        os: [macos-15, macos-26, xcode-27]
        deleter: [rm, rmz]
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Survey the runner
        continue-on-error: true
        run: |
          set +e
          sw_vers
          uname -m
          sysctl -n hw.ncpu hw.memsize
          df -k /
          df -k /System/Volumes/Data
          diskutil apfs list
          xcode-select -p
          xcrun simctl runtime list
          ls /Applications

          # The fields of the second line of df -k: size and free, in KiB
          df_gb() {
            df -k "$1" | awk 'NR == 2 { printf "%.1f GB size, %.1f GB free", $2 / 1048576, $4 / 1048576 }'
          }
          container="$(diskutil info / | awk -F': *' '/APFS Container:/ { print $2; exit }')"
          container_size="$(diskutil apfs list "${container}" | awk -F': *' '/Size \(Capacity Ceiling\)/ { print $2; exit }')"
          container_free="$(diskutil apfs list "${container}" | awk -F': *' '/Capacity Not Allocated/ { print $2; exit }')"
          {
            echo "### Runner on $(sw_vers -productVersion) ($(uname -m))"
            echo
            echo "| Fact | Value |"
            echo "| --- | --- |"
            echo "| macOS | $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion)) |"
            echo "| Architecture | $(uname -m) |"
            echo "| CPUs | $(sysctl -n hw.ncpu) |"
            echo "| Memory | $(sysctl -n hw.memsize | awk '{ printf "%.1f GB", $1 / 1073741824 }') |"
            echo "| \`/\` | $(df_gb /) |"
            echo "| \`/System/Volumes/Data\` | $(df_gb /System/Volumes/Data) |"
            echo "| APFS container ${container} size | ${container_size} |"
            echo "| APFS container ${container} free | ${container_free} |"
            echo "| \`xcode-select -p\` | \`$(xcode-select -p)\` |"
            echo
            echo "| Simulator runtimes |"
            echo "| --- |"
            xcrun simctl runtime list 2>&1 | grep -v '^[[:space:]]*$' | sed -e 's/|/\\|/g' -e 's/^/| /' -e 's/$/ |/'
            echo
            echo "| /Applications |"
            echo "| --- |"
            for app in /Applications/*; do
              echo "| ${app##*/} |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Measure the candidates
        continue-on-error: true
        run: |
          set +e
          shopt -s nullglob
          # macOS has no timeout command, so use alarm in perl as a fallback
          limit() {
            if command -v timeout > /dev/null; then
              sudo timeout 120 "$@"
            else
              sudo perl -e 'alarm shift; exec @ARGV' 120 "$@"
            fi
          }
          candidates=(
            /Applications/Xcode*.app
            /Library/Developer/CoreSimulator
            /System/Library/AssetsV2
            "${HOME}/Library/Developer"
            /Users/runner/hostedtoolcache
            "${HOME}/Library/Android/sdk"
            /usr/local/share/dotnet
            "${HOME}/.dotnet"
            /opt/homebrew
            /usr/local/Homebrew
            /usr/local/lib/node_modules
            "${HOME}/.rustup"
            "${HOME}/.cargo"
            "${HOME}/.ghcup"
            /Library/Frameworks/Mono.framework
            /Library/Frameworks/Python.framework
            /Library/Frameworks/Xamarin*
            "/Applications/Google Chrome.app"
            /Applications/Firefox.app
            "/Applications/Microsoft Edge.app"
            "${HOME}/Library/Caches"
            /Library/Developer/CommandLineTools
          )
          results="$(mktemp)"
          for path in "${candidates[@]}"; do
            if [[ ! -e "${path}" ]]; then
              echo "Not found: ${path}"
              continue
            fi
            note=""
            case "${path}" in
              /System/Library/AssetsV2|/Library/Developer/CommandLineTools) note="report only";;
            esac
            start="${SECONDS}"
            kb="$(limit du -sk "${path}" 2> /dev/null | awk '{ print $1 }')"
            seconds=$((SECONDS - start))
            echo "${path}: ${kb:-unknown} KiB in ${seconds} s ${note}"
            printf '%s\t%s\t%s\t%s\n' "${kb:-0}" "${path}" "${seconds}" "${note}" >> "${results}"
          done
          {
            echo "### Candidates on $(sw_vers -productVersion), largest first"
            echo
            echo "| Path | Size | du seconds | Note |"
            echo "| --- | --- | --- | --- |"
            sort -rn "${results}" | awk -F'\t' '{ printf "| `%s` | %.2f GB | %s | %s |\n", $2, $1 / 1048576, $3, $4 }'
          } >> "${GITHUB_STEP_SUMMARY}"
          rm -f "${results}"
      - name: Time the move and delete of the Android SDK
        continue-on-error: true
        env:
          DELETER: ${{ matrix.deleter }}
          RMZ_VERSION: '3.2.1'
          # SHA-256 of aarch64-apple-darwin-rmz in the fuc 3.2.1 release
          RMZ_SHA256: 'da01fabf7169daab1b115175fe816731a76f281291bd084a859e4266eec3970c'
        run: |
          set +e
          now() { perl -MTime::HiRes=time -e 'printf "%.3f\n", time'; }
          elapsed() { awk -v a="$1" -v b="$2" 'BEGIN { printf "%.1f", b - a }'; }
          data_free() { df -k /System/Volumes/Data | awk 'NR == 2 { printf "%.1f GB", $4 / 1048576 }'; }
          sdk="${HOME}/Library/Android/sdk"
          if [[ ! -d "${sdk}" ]]; then
            echo "${sdk} does not exist, so the timing is skipped"
            echo "### Android SDK: ${sdk} does not exist, timing skipped" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ "${DELETER}" == "rmz" ]]; then
            rmz_dir="$(mktemp -d)"
            curl --fail --silent --show-error --location --retry 3 -o "${rmz_dir}/rmz" \
              "https://github.com/SUPERCILEX/fuc/releases/download/${RMZ_VERSION}/aarch64-apple-darwin-rmz"
            if ! echo "${RMZ_SHA256}  ${rmz_dir}/rmz" | shasum -a 256 --check --quiet; then
              echo "::warning::The rmz ${RMZ_VERSION} download does not match the expected SHA-256 ${RMZ_SHA256}"
              echo "### Android SDK: the rmz download failed its checksum, timing skipped" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            chmod +x "${rmz_dir}/rmz"
          fi
          staging="/private/var/tmp/nothing-but-nix.staging"
          sudo mkdir -p "${staging}"
          df -k /System/Volumes/Data
          free_before="$(data_free)"
          t0="$(now)"
          sudo mv "${sdk}" "${staging}/android-sdk"
          t1="$(now)"
          if [[ "${DELETER}" == "rmz" ]]; then
            sudo "${rmz_dir}/rmz" -f "${staging}/android-sdk"
          else
            sudo rm -rf "${staging}/android-sdk"
          fi
          t2="$(now)"
          df -k /System/Volumes/Data
          free_after="$(data_free)"
          mv_seconds="$(elapsed "${t0}" "${t1}")"
          delete_seconds="$(elapsed "${t1}" "${t2}")"
          echo "mv: ${mv_seconds} s, ${DELETER}: ${delete_seconds} s, Data free ${free_before} before, ${free_after} after"
          {
            echo "### Android SDK on $(sw_vers -productVersion) with ${DELETER}"
            echo
            echo "| Deleter | mv seconds | Delete seconds | Data free before | Data free after |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| ${DELETER} | ${mv_seconds} | ${delete_seconds} | ${free_before} | ${free_after} |"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Time the delete of the simulator runtimes
        if: matrix.deleter == 'rm'
        continue-on-error: true
        run: |
          set +e
          now() { perl -MTime::HiRes=time -e 'printf "%.3f\n", time'; }
          data_free() { df -k /System/Volumes/Data | awk 'NR == 2 { printf "%.1f GB", $4 / 1048576 }'; }
          if ! xcrun simctl runtime list; then
            echo "xcrun simctl runtime list failed, so the timing is skipped"
            echo "### Simulator runtimes: xcrun simctl runtime list failed, timing skipped" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          df -k /System/Volumes/Data
          free_before="$(data_free)"
          t0="$(now)"
          xcrun simctl runtime delete all
          t1="$(now)"
          df -k /System/Volumes/Data
          free_after="$(data_free)"
          xcrun simctl runtime list
          delete_seconds="$(awk -v a="${t0}" -v b="${t1}" 'BEGIN { printf "%.1f", b - a }')"
          echo "simctl runtime delete all: ${delete_seconds} s, Data free ${free_before} before, ${free_after} after"
          {
            echo "### Simulator runtimes on $(sw_vers -productVersion)"
            echo
            echo "| Delete seconds | Data free before | Data free after |"
            echo "| --- | --- | --- |"
            echo "| ${delete_seconds} | ${free_before} | ${free_after} |"
          } >> "${GITHUB_STEP_SUMMARY}"
  lint:
    name: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          # From actionlint_1.7.12_checksums.txt in the release
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          actionlint_dir="$(mktemp --directory)"
          curl --fail --silent --show-error --location --retry 3 \
            -o "${actionlint_dir}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          if ! echo "${ACTIONLINT_SHA256}  ${actionlint_dir}/${tarball}" | sha256sum --check --quiet --strict -; then
            echo "::error::The actionlint ${ACTIONLINT_VERSION} download does not match the expected SHA-256 ${ACTIONLINT_SHA256}"
            exit 1
          fi
          tar -xzf "${actionlint_dir}/${tarball}" -C "${actionlint_dir}" actionlint
          sudo install -m 0755 "${actionlint_dir}/actionlint" /usr/local/bin/actionlint
          rm -rf "${actionlint_dir}"
      - name: Lint
        run: |
          actionlint --version
          shellcheck --version
          yq --version
          .github/scripts/lint.sh
  sentinel:
    name: "👁️ Sentinel"
    if: always()
    needs: [determinate-nix-action, nix-quick-install, cachix-nix-action, background-purge, ubuntu-slim, unsupported-os, lint]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "${NEEDS}"
          if ! jq -e 'all(.[]; .result == "success")' <<< "${NEEDS}" > /dev/null; then
            echo "::error::One or more test jobs did not succeed"
            exit 1
          fi
