name: 'Nothing but Nix'
description: 'Removes all the cruft 🪓 from a GitHub Actions runner to make the most space possible for Nix ️❄️'
branding:
  icon: 'trash-2'
  color: 'red'
inputs:
  hatchet-protocol:
    description: 'Level of file purging (Holster: none, Carve: fast, Cleave: standard, Rampage: aggressive)'
    required: false
    default: 'cleave'
  witness-carnage:
    description: 'Display purge progress in real-time instead of running in background'
    required: false
    default: 'false'
  root-safe-haven:
    description: 'Space in MB to mercifully spare on the / filesystem, or auto: 10240 for holster and carve, 6144 for cleave and rampage, at most 25% of the free space of / and at least 2048 (default: auto)'
    required: false
    default: 'auto'
  mnt-safe-haven:
    description: 'Space in MB to mercifully spare on the /mnt filesystem (default: 1024)'
    required: false
    default: '1024'
  nix-permission-edict:
    description: 'Grant user ownership of /nix directory (default: false). Useful for Nix installers that require user-writable /nix.'
    required: false
    default: 'false'
  btrfs-compression:
    description: 'Btrfs compression for /nix: none, lzo, zlib, zlib:1 to zlib:9, zstd, zstd:1 to zstd:15, or zstd:-1 to zstd:-15 (default: zstd:1)'
    required: false
    default: 'zstd:1'
outputs:
  root-free-bytes:
    description: 'Free bytes on the / filesystem before the action purges anything'
    value: ${{ steps.survey.outputs.root-free-bytes }}
  nix-size-bytes:
    description: 'Size in bytes of /nix when the action finishes. In background mode the purge can grow /nix later.'
    value: ${{ steps.purge.outputs.nix-size-bytes }}
  nix-avail-bytes:
    description: 'Available bytes on /nix when the action finishes. In background mode the purge can grow /nix later.'
    value: ${{ steps.purge.outputs.nix-avail-bytes }}
  purge-seconds:
    description: 'Duration of the purge in seconds. Empty in background mode, where the post step reports it.'
    value: ${{ steps.purge.outputs.purge-seconds }}
runs:
  using: composite
  steps:
    - name: The Checks
      id: environment-check
      shell: bash
      run: |
        # Check for macOS/Darwin - warn but don't fail
        if [[ "${{ runner.os }}" == "macOS" ]]; then
          echo "is_supported=false" >> $GITHUB_OUTPUT
          echo "⚠️  Nothing but Nix is designed for Ubuntu runners only."
          echo "ℹ️  macOS/Darwin runners are not supported yet. They can start with only 40 to 47 GB free, so a large Nix store can still run out of space."
          echo "ℹ️  This action will be skipped and your workflow will continue normally."
          exit 0
        fi

        # Check for Windows - warn but don't fail
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          echo "is_supported=false" >> $GITHUB_OUTPUT
          echo "⚠️  Nothing but Nix is designed for Ubuntu runners only."
          echo "ℹ️  Windows runners do not require this action - they have different filesystem layouts and constraints."
          echo "ℹ️  This action will be skipped and your workflow will continue normally."
          exit 0
        fi

        # Check for loop device support - warn but don't fail. Container
        # runners such as ubuntu-slim have no loop devices and cannot mount.
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          loop_reason=""
          if [[ ! -e /dev/loop-control ]]; then
            loop_reason="/dev/loop-control does not exist"
          elif ! sudo -n losetup --find > /dev/null 2>&1; then
            loop_reason="sudo -n losetup --find failed"
          fi
          if [[ -n "${loop_reason}" ]]; then
            echo "is_supported=false" >> "${GITHUB_OUTPUT}"
            echo "⚠️  Nothing but Nix needs loop devices, and this runner cannot use them: ${loop_reason}."
            echo "ℹ️  Container runners such as ubuntu-slim are not supported."
            echo "ℹ️  This action will be skipped and your workflow will continue normally."
            exit 0
          fi
        fi

        # Check for Ubuntu on Linux runners
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          if [ "$(lsb_release -is)" != "Ubuntu" ]; then
            echo "is_supported=false" >> $GITHUB_OUTPUT
            echo "❌ This action only works on Ubuntu runners"
            exit 1
          else
            echo "is_supported=true" >> $GITHUB_OUTPUT
          fi
        fi

        # Check for GitHub Actions environment
        if [ -z "$GITHUB_ACTIONS" ]; then
          echo "is_supported=false" >> $GITHUB_OUTPUT
          echo "❌ This action only works on GitHub Actions runners"
          exit 1
        fi

        # Check that Nix is not already installed
        if [ -d /nix ]; then
          echo "is_supported=false" >> $GITHUB_OUTPUT
          echo "❌ This action must be run before Nix is installed"
          exit 1
        else
          echo "is_supported=true" >> $GITHUB_OUTPUT
        fi
    - name: The Hatchet Protocol
      id: set-hatchet-protocol
      if: steps.environment-check.outputs.is_supported == 'true'
      shell: bash
      env:
        ROOT_SAFE_HAVEN: ${{ inputs.root-safe-haven }}
      run: |
        input_protocol="${{ inputs.hatchet-protocol }}"
        # Convert to lowercase for case-insensitive comparison
        input_protocol="$(tr '[:upper:]' '[:lower:]' <<< "$input_protocol")"

        case "$input_protocol" in
          "holster")
            echo "🪓 Hatchet Protocol: Holster - Keep the hatchet sheathed, use space from /mnt (Level 0)"
            protocol_name="holster"
            protocol_level=0;;
          "carve")
            echo "🪓 Hatchet Protocol: Carve - Cut the large toolchains that dpkg does not own, fast (Level 1)"
            protocol_name="carve"
            protocol_level=1;;
          "cleave")
            echo "🪓 Hatchet Protocol: Cleave - Make powerful, decisive cuts to large packages (Level 2)"
            protocol_name="cleave"
            protocol_level=2;;
          "rampage")
            echo "🪓 Hatchet Protocol: Rampage - Relentless, brutal elimination of all bloat (Level 3)"
            protocol_name="rampage"
            protocol_level=3;;
          *)
            echo "🪓 Hatchet Protocol: Cleave - Make powerful, decisive cuts to large packages (Level 2)"
            protocol_name="cleave"
            protocol_level=2;;
        esac

        # Resolve the root safe haven. Holster and carve keep Docker and the
        # runner toolchains, so auto reserves more of / for them. On small
        # disks, auto takes at most 25% of the free space of /, but never
        # less than 2048MB.
        root_safe_haven="$(tr '[:upper:]' '[:lower:]' <<< "${ROOT_SAFE_HAVEN}")"
        if [[ "${root_safe_haven}" == "auto" ]]; then
          if [[ "${protocol_level}" -le 1 ]]; then
            root_safe_haven=10240
          else
            root_safe_haven=6144
          fi
          root_free_mb=$(df -m --output=avail / | tail -n 1 | tr -d ' ')
          if [[ ! "${root_free_mb}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read the free space of / to resolve root-safe-haven: auto"
            exit 1
          fi
          root_cap_mb=$((root_free_mb / 4))
          if [[ "${root_cap_mb}" -lt 2048 ]]; then
            root_cap_mb=2048
          fi
          if [[ "${root_safe_haven}" -gt "${root_cap_mb}" ]]; then
            echo "🛡️  Root safe haven: auto, ${root_cap_mb}MB for ${protocol_name}, capped from ${root_safe_haven}MB because / has only ${root_free_mb}MB free (25% of free space, at least 2048MB)"
            root_safe_haven="${root_cap_mb}"
          else
            echo "🛡️  Root safe haven: auto, ${root_safe_haven}MB for ${protocol_name}"
          fi
        elif [[ "${root_safe_haven}" =~ ^[1-9][0-9]*$ ]]; then
          echo "🛡️  Root safe haven: ${root_safe_haven}MB"
        else
          echo "::error::root-safe-haven '${ROOT_SAFE_HAVEN}' is not valid. Use auto or a positive whole number of MB."
          exit 1
        fi

        echo "level=${protocol_level}" >> $GITHUB_OUTPUT
        echo "name=${protocol_name}" >> "${GITHUB_OUTPUT}"
        echo "root-safe-haven=${root_safe_haven}" >> "${GITHUB_OUTPUT}"
    - name: The Survey
      id: survey
      if: steps.environment-check.outputs.is_supported == 'true'
      shell: bash
      run: |
        root_free_bytes=$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')
        echo "Free space of / before the purge: ${root_free_bytes} bytes"
        echo "root-free-bytes=${root_free_bytes}" >> "${GITHUB_OUTPUT}"
    - name: The Setup
      if: steps.environment-check.outputs.is_supported == 'true' && steps.set-hatchet-protocol.outputs.level >= 1
      shell: bash
      run: |
        # rmz from Fast Unix Commands, pinned to one release. Check the
        # download against the SHA-256 of the release asset before use.
        RMZ_VERSION="3.2.1"
        ARCH=$(uname -m)
        if [[ "$ARCH" == "x86_64" ]]; then
          URL_ARCH="x86_64"
          RMZ_SHA256="e2c2c07e731d9422dfe3f14e17e010c6dd5f7a4ad54a9c9bcd141cb8a5ec4fb1"
        elif [[ "$ARCH" == "aarch64" || "$ARCH" == "arm64" ]]; then
          URL_ARCH="aarch64"
          RMZ_SHA256="62059f80a71715d6c4197c0729f157a9c1bbe537a5bdfa830397c47b3ae1ed74"
        else
          echo "::error::Unsupported architecture for rmz: $ARCH"
          exit 1
        fi

        DOWNLOAD_URL="https://github.com/SUPERCILEX/fuc/releases/download/${RMZ_VERSION}/${URL_ARCH}-unknown-linux-gnu-rmz"
        rmz_dir="$(mktemp --directory)"
        curl --fail --silent --show-error --location --retry 3 -o "${rmz_dir}/rmz" "$DOWNLOAD_URL"
        if ! echo "${RMZ_SHA256}  ${rmz_dir}/rmz" | sha256sum --check --quiet --strict -; then
          echo "::error::The rmz ${RMZ_VERSION} download for ${URL_ARCH} does not match the expected SHA-256 ${RMZ_SHA256}"
          rm -rf "${rmz_dir}"
          exit 1
        fi
        sudo install -m 0755 "${rmz_dir}/rmz" /usr/bin/rmz
        rm -rf "${rmz_dir}"
        rmz --version
    - name: The Volume
      if: steps.environment-check.outputs.is_supported == 'true'
      shell: bash
      env:
        BTRFS_COMPRESSION: ${{ inputs.btrfs-compression }}
      run: |
        # Check the compression before anything changes on disk
        compression="${BTRFS_COMPRESSION}"
        if [[ ! "${compression}" =~ ^(none|lzo|zlib|zlib:[1-9]|zstd|zstd:-?([1-9]|1[0-5]))$ ]]; then
          echo "::error::btrfs-compression '${compression}' is not valid. Use none, lzo, zlib, zlib:1 to zlib:9, zstd, zstd:1 to zstd:15, or zstd:-1 to zstd:-15."
          exit 1
        fi
        # Kernels older than 6.15 map a negative zstd level to level 3
        # without a warning, and level 3 is slower than level 1.
        if [[ "${compression}" == zstd:-* ]]; then
          kernel_release="$(uname -r)"
          if [[ ! "${kernel_release}" =~ ^([0-9]+)\.([0-9]+) ]] ||
            (( BASH_REMATCH[1] < 6 || (BASH_REMATCH[1] == 6 && BASH_REMATCH[2] < 15) )); then
            echo "::warning::btrfs-compression ${compression} needs kernel 6.15 or later, and this runner has ${kernel_release}, so /nix uses zstd:1"
            compression="zstd:1"
          fi
        fi
        echo "Btrfs compression: ${compression}"

        free_space=$(df -m --output=avail /mnt | tail -n 1 | tr -d ' ')
        echo "Initial free space of /mnt: ${free_space}MB"

        root_fs_dev=$(df -P / | awk 'NR==2 {print $1}')
        mnt_fs_dev=$(df -P /mnt | awk 'NR==2 {print $1}')
        if [ "${root_fs_dev}" = "${mnt_fs_dev}" ]; then
          effective_safe_haven=${{ steps.set-hatchet-protocol.outputs.root-safe-haven }}
          if [ "${{ inputs.mnt-safe-haven }}" -gt "${effective_safe_haven}" ]; then
            effective_safe_haven=${{ inputs.mnt-safe-haven }}
          fi
          echo "ℹ️  / and /mnt share filesystem ${root_fs_dev}; reserving ${effective_safe_haven}MB safe haven"
        else
          effective_safe_haven=${{ inputs.mnt-safe-haven }}
        fi

        # Minimum usable space: safe haven + 1024MB for a useful initial volume
        min_required=$((effective_safe_haven + 1024))
        if [ "${free_space}" -lt "${min_required}" ]; then
          echo "❌ Insufficient free space on /mnt to create initial volume."
          echo "   Available: ${free_space}MB, Required: at least ${min_required}MB"
          echo "   Contents of /mnt:"
          sudo ls -lah /mnt
          echo "   This may indicate leftover data from a previous job on this runner."
          echo "   Try re-running the workflow to get a different runner."
          exit 1
        fi

        # Attach a disk image with direct I/O and 4096-byte sectors, so that
        # its data is not cached twice, once for Btrfs and once for the image
        # file. Attach it without them when losetup rejects either option.
        function attach_image() {
          if ! sudo losetup --direct-io=on --sector-size 4096 "$1" "$2"; then
            echo "::warning::losetup rejected --direct-io=on --sector-size 4096 for $2, so $1 uses buffered I/O"
            sudo losetup "$1" "$2"
          fi
        }

        loop_dev=$(sudo losetup --find)
        loop_num=${loop_dev##*/loop}

        if sudo fallocate -l $((free_space - effective_safe_haven))M "/mnt/disk${loop_num}.img"; then
          attach_image "${loop_dev}" "/mnt/disk${loop_num}.img"
          sudo losetup --list --output NAME,DIO,LOG-SEC "${loop_dev}"
        else
          echo "❌ Failed to allocate disk image on /mnt"
          exit 1
        fi

        # Create filesystem
        sudo mkfs.btrfs -L nix -d single -m single --nodiscard "${loop_dev}"
        sudo btrfs device scan
        sudo btrfs filesystem show

        # Create one subvolume for /nix and one for temporary files
        mount_opts="noatime,nobarrier,nodiscard"
        if [[ "${compression}" != "none" ]]; then
          mount_opts+=",compress=${compression}"
        fi
        mount_opts+=",space_cache=v2,commit=120"
        btrfs_top="$(sudo mktemp --directory)"
        sudo mount LABEL=nix "${btrfs_top}" -o "${mount_opts}"
        sudo btrfs subvolume create "${btrfs_top}/@nix"
        sudo btrfs subvolume create "${btrfs_top}/@tmp"
        sudo umount "${btrfs_top}"
        sudo rmdir "${btrfs_top}"

        # Mount the subvolumes
        sudo mkdir -p /nix /var/tmp/nothing-but-nix
        sudo mount LABEL=nix /nix -o "subvol=@nix,${mount_opts}"
        sudo mount LABEL=nix /var/tmp/nothing-but-nix -o "subvol=@tmp,${mount_opts}"
        sudo chmod 1777 /var/tmp/nothing-but-nix
        sudo df -h

        # Create /nix/build for Nix's build-dir setting
        sudo mkdir -p /nix/build

        if [[ "${{ inputs.nix-permission-edict }}" == "true" ]]; then
          echo "Applying Nix Permission Edict: Granting user ownership of /nix"
          sudo chown -R "$(id --user)":"$(id --group)" /nix
        fi

        # TMPDIR must stay outside /nix. The Nix multi-user installer runs
        # `chown -R root:nixbld /nix`, which locks the installer out of its own
        # temporary files under TMPDIR (#24, #57). The @tmp subvolume keeps
        # temporary files on the compressed Btrfs pool. The guard below fails
        # the step when TMPDIR resolves under /nix.
        TMPNIX="$(sudo mktemp --directory --tmpdir=/var/tmp/nothing-but-nix)"
        sudo chmod 1777 "${TMPNIX}"
        echo "TMPDIR=${TMPNIX}" >> $GITHUB_ENV
        if ! tmpdir_real="$(realpath -e "${TMPNIX}")"; then
          echo "::error::TMPDIR (${TMPNIX}) could not be resolved"
          exit 1
        fi
        case "${tmpdir_real}" in
          /nix|/nix/*)
            echo "::error::TMPDIR (${tmpdir_real}) must stay outside /nix because the Nix multi-user installer runs chown -R root:nixbld /nix (#57)"
            exit 1
            ;;
        esac

        # Create a directory to store expansion state
        mkdir -p "${HOME}/.expansion"
        echo "Initial volume created" | tee "${HOME}/.expansion/holster_done"
    - name: The Local
      if: steps.environment-check.outputs.is_supported == 'true' && steps.set-hatchet-protocol.outputs.level >= 2
      shell: bash
      run: |
        # Nix is often installed in /usr/local, so we need to ensure that it is purged early.
        # Renaming is instant; the contents are deleted in the background by Cleave.
        sudo mv /usr/local /usr/local.purge
        sudo mkdir -p /usr/local/{bin,doc,include,lib,man,sbin,share,src} || true
    - name: The Purge
      id: purge
      if: steps.environment-check.outputs.is_supported == 'true'
      shell: bash
      run: |
        cat > /tmp/expand_nix_volume.sh << 'EOF'
        #!/usr/bin/env bash
        set -e

        protocol_level="${{ steps.set-hatchet-protocol.outputs.level }}"
        expansion_dir="${HOME}/.expansion"
        root_safe_haven="${{ steps.set-hatchet-protocol.outputs.root-safe-haven }}"
        mnt_safe_haven="${{ inputs.mnt-safe-haven }}"

        root_fs_dev=$(df -P / | awk 'NR==2 {print $1}')
        mnt_fs_dev=$(df -P /mnt | awk 'NR==2 {print $1}')
        if [ "${root_fs_dev}" = "${mnt_fs_dev}" ] && [ "${mnt_safe_haven}" -gt "${root_safe_haven}" ]; then
          root_safe_haven="${mnt_safe_haven}"
        fi

        # Print the installed packages whose names match one or more of the
        # given extended regular expressions. Each expression must match the
        # whole package name.
        function installed_packages() {
          local regex
          regex="^($(IFS='|'; echo "$*")) "
          # shellcheck disable=SC2016 # dpkg-query expands these fields
          dpkg-query --show --showformat='${db:Status-Status} ${Package} ${binary:Package}\n' |
            awk '$1 == "installed" { print $2 " " $3 }' |
            grep -E "${regex}" |
            cut -d ' ' -f 2 |
            sort -u
        }

        # Run apt-get without prompts. Wait for the dpkg lock if another apt
        # process holds it.
        function apt_get() {
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -y -q \
            -o Dpkg::Use-Pty=0 \
            -o DPkg::Lock::Timeout=120 \
            "$@"
        }

        # Remove and purge the installed packages that match the given
        # expressions, and the packages that nothing needs any more, in one
        # apt-get call. apt-get fails on a name that matches no package, and
        # set -e then stops the purge, so pass only installed packages.
        # The classic solver also removes the packages that depend on the
        # removed ones. The apt 3 solver keeps them, fails, and times out.
        function remove_packages() {
          local packages=()
          mapfile -t packages < <(installed_packages "$@")
          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "No installed package matches: $*"
            apt_get autoremove --purge
            return 0
          fi
          echo "Removing ${#packages[@]} packages"
          apt_get -o APT::Solver=internal \
            remove --purge --autoremove "${packages[@]}"
        }

        # Restore update-initramfs.conf when the purge exits.
        initramfs_conf=/etc/initramfs-tools/update-initramfs.conf
        function restore_initramfs_conf() {
          if [[ -f "${initramfs_conf}.nothing-but-nix" ]]; then
            sudo mv "${initramfs_conf}.nothing-but-nix" "${initramfs_conf}"
          fi
        }

        # Run one rmz per path in parallel and wait for all of them.
        function rmz_parallel() {
          local path pid pids=() status=0
          for path in "$@"; do
            sudo rmz -f "${path}" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "${pid}" || status=1
          done
          return "${status}"
        }

        # Print the given paths that exist and that no dpkg package owns.
        function unowned_paths() {
          local existing=() line owned="" owned_paths="" path search_status=0
          for path in "$@"; do
            if [[ -e "${path}" ]]; then
              existing+=("${path}")
            fi
          done
          if [[ "${#existing[@]}" -eq 0 ]]; then
            return 0
          fi
          # dpkg-query exits 1 when a path has no owner, which is expected
          # here, and 2 on a fatal error. Each output line is
          # "package[:arch][, package[:arch]]: path" or
          # "diversion by package from|to: path". The owner part never
          # contains ": ", so the path starts after the first ": ".
          owned="$(dpkg-query --search "${existing[@]}" 2>/dev/null)" || search_status=$?
          if [[ "${search_status}" -gt 1 ]]; then
            echo "dpkg-query failed with status ${search_status}, so no path counts as unowned" >&2
            return 0
          fi
          while IFS= read -r line; do
            if [[ -z "${line}" ]]; then
              continue
            fi
            path="${line#*: }"
            if [[ "${path}" == "${line}" || "${path}" != /* ]]; then
              echo "dpkg-query printed an unexpected line, so no path counts as unowned: ${line}" >&2
              return 0
            fi
            owned_paths+="${path}"$'\n'
          done <<< "${owned}"
          for path in "${existing[@]}"; do
            if ! grep -qxF -- "${path}" <<< "${owned_paths}"; then
              echo "${path}"
            fi
          done
        }

        # Print the large trees for this protocol that dpkg does not own. The
        # purge deletes these first, so that /nix grows before the slower
        # Docker and apt work. Carve deletes only these trees. A path that
        # dpkg owns waits for the later phases, which delete it only when the
        # Cleave or Rampage rmz list names it. /opt/ghc, /usr/share/dotnet,
        # and the /usr/local trees for carve are in this list only, so the
        # purge never deletes them behind dpkg's back.
        function fast_trees() {
          local trees=()
          shopt -s nullglob
          if [[ "${protocol_level}" -ge 1 ]]; then
            # Cleave moves /usr/local to /usr/local.purge first, so the two
            # /usr/local paths exist only for carve.
            trees+=(
              "${HOME}/.rustup"
              "${HOME}/.cargo"
              /opt/ghc
              /opt/hostedtoolcache
              /usr/local/.ghcup
              /usr/local/lib/android
              /usr/share/dotnet
              /usr/share/swift
            )
          fi
          if [[ "${protocol_level}" -ge 2 ]]; then
            trees+=(
              "${HOME}/.dotnet"
              /opt/pipx*
              /usr/local.purge
            )
          fi
          if [[ "${protocol_level}" -ge 3 ]]; then
            trees+=(
              /usr/lib/heroku
              /usr/share/apache-*
              /usr/share/az_*
              /usr/share/gradle-*
              /usr/share/kotlinc
              /usr/share/miniconda
              /usr/share/sbt
            )
          fi
          shopt -u nullglob
          if [[ "${#trees[@]}" -gt 0 ]]; then
            unowned_paths "${trees[@]}"
          fi
        }

        # Attach a disk image with direct I/O and 4096-byte sectors, like the
        # initial volume. Attach it without them when losetup rejects either
        # option.
        function attach_image() {
          if ! sudo losetup --direct-io=on --sector-size 4096 "$1" "$2"; then
            echo "::warning::losetup rejected --direct-io=on --sector-size 4096 for $2, so $1 uses buffered I/O"
            sudo losetup "$1" "$2"
          fi
        }

        # Grow /nix with the free space of / less the safe haven. The purge
        # calls this after each phase that frees space. Each call that finds
        # enough space adds one more disk image to the /nix pool.
        function add_expansion_disk() {
          local disk_image disk_size free_space loop_dev loop_num
          free_space=$(df -m --output=avail / | tail -n 1 | tr -d ' ')
          echo "Free space of /: ${free_space}MB"

          # Create an expansion disk only when suitable free space exists
          if [[ "${free_space}" -le $((root_safe_haven + 2048)) ]]; then
            echo "Not enough free space on / to grow /nix"
            return 0
          fi

          # Calculate the size of the expansion disk, reserving the safe haven
          disk_size=$((free_space - root_safe_haven))
          echo "Creating expansion disk of ${disk_size}MB in /"
          loop_dev=$(sudo losetup --find)
          loop_num=${loop_dev##*/loop}
          disk_image="/disk${loop_num}.img"
          if sudo fallocate -l "${disk_size}M" "${disk_image}"; then
            attach_image "${loop_dev}" "${disk_image}"

            # Add the new device to the pool
            sudo btrfs device add --nodiscard "${loop_dev}" /nix
            echo "Added expansion disk ${disk_image} (${loop_dev}, ${disk_size}MB) to /nix pool" >> "${expansion_dir}/expansion_done"
            sudo btrfs filesystem show
          fi
        }

        # Delete the trees that dpkg does not own, then grow /nix at once.
        # Carve stops after this phase, with no Docker or apt work.
        if [[ "${protocol_level}" -ge 1 ]]; then
          mapfile -t trees < <(fast_trees)
          if [[ "${#trees[@]}" -gt 0 ]]; then
            echo "Deleting trees that dpkg does not own: ${trees[*]}"
            rmz_parallel "${trees[@]}"
          fi
          echo "Fast purge complete" > "${expansion_dir}/fast_done"
          add_expansion_disk
        fi
        if [[ "${protocol_level}" -eq 1 ]]; then
          echo "Disk space has been carved out" > "${expansion_dir}/carve_done"
        fi

        # Cleanse docker. Stop the daemons, then delete their data in one
        # pass. Docker 29 on Ubuntu 26.04 keeps images in /var/lib/containerd,
        # older images keep them in /var/lib/docker.
        if [[ "${protocol_level}" -ge 2 ]]; then
          docker_units=()
          for unit in docker.socket docker.service containerd.service; do
            if [[ "$(systemctl show --property=LoadState --value "${unit}")" == "loaded" ]]; then
              docker_units+=("${unit}")
            fi
          done
          if [[ "${#docker_units[@]}" -gt 0 ]]; then
            echo "Stopping ${docker_units[*]}"
            sudo systemctl stop "${docker_units[@]}"
          fi
          rmz_parallel /var/lib/docker /var/lib/containerd
        fi

        # Cleanse apt
        if [[ "${protocol_level}" -ge 2 ]]; then
          sudo tee /etc/dpkg/dpkg.cfg.d/01_nocruft > /dev/null << 'APTCFG'
        path-exclude /usr/share/doc/*
        path-exclude /usr/share/fonts/*
        path-exclude /usr/share/icons/*
        path-exclude /usr/share/info/*
        path-exclude /usr/share/man/*
        APTCFG

          # Skip initramfs rebuilds while packages go. The runner does not boot
          # again, and update-initramfs.conf(5) documents update_initramfs=no
          # for this. Images that use dracut do not have this file.
          if [[ -f "${initramfs_conf}" ]]; then
            sudo cp -p "${initramfs_conf}" "${initramfs_conf}.nothing-but-nix"
            trap restore_initramfs_conf EXIT
            sudo sed -i 's/^update_initramfs=.*/update_initramfs=no/' "${initramfs_conf}"
          fi

          # Remove the Docker and snapd packages, and the Rampage list, in one
          # apt-get call, so that dpkg runs its triggers once.
          packages=('docker.*' 'snapd')
          if [[ "${protocol_level}" -ge 3 ]]; then
            packages+=(
              'apache2.*'
              'aspnetcore-.*'
              'azure-cli'
              'buildah'
              'byobu.*'
              'clang-.*'
              'containerd\.io'
              'containernetworking-plugins'
              'dotnet-.*'
              'firefox'
              'fonts-.*'
              'fwupd'
              'gfortran-.*'
              'google-.*'
              'gradle.*'
              'java.*'
              'kotlin.*'
              'kubectl'
              'libclang-.*'
              'libgl1-mesa-dri'
              'libgirepository-.*'
              'libgtk-.*'
              'libllvm-.*'
              'libx265-.*'
              'llvm-.*'
              'man-db'
              'mecab.*'
              'mediainfo'
              'mercurial.*'
              'microsoft-edge-stable'
              'mongodb-.*'
              'mono-.*'
              'mssql-.*'
              'mysql-.*'
              'nginx-.*'
              'php.*'
              'podman.*'
              'powershell.*'
              'postgres.*'
              'python-babel-localedata'
              'python3-babel.*'
              'python3-boto.*'
              'ruby.*'
              'r-base.*'
              'skopeo'
              'tcl'
              'tk'
              'tex-.*'
              'vim.*'
            )
          fi
          remove_packages "${packages[@]}"
          apt_get clean
          restore_initramfs_conf
          echo "Cleanse apt complete" > "${expansion_dir}/apt_done"

          # Delete what the docker and snapd packages leave behind
          sudo rmz -f /usr/bin/docker*
          echo "Cleanse docker complete" > "${expansion_dir}/docker_done"
          sudo rmz -f \
            /snap \
            /usr/lib/snapd \
            /var/snap \
            /var/lib/snapd \
            "${HOME}/snap"
          echo "Cleanse snap complete" > "${expansion_dir}/snap_done"
        fi

        # Cleave
        if [[ "${protocol_level}" -ge 2 ]]; then
          sudo rmz -f \
            "${HOME}/.rustup" \
            "${HOME}/.cargo" \
            "${HOME}/.dotnet" \
            /opt/containerd \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /opt/az \
            /opt/pipx* \
            /opt/google \
            /opt/mssql-tools \
            /usr/local.purge
          echo "Cleave complete" > "${expansion_dir}/cleave_done"
        fi

        # Rampage
        if [[ "${protocol_level}" -ge 3 ]]; then
          sudo rmz -f \
            /usr/bin/kotlin* \
            /usr/lib/heroku \
            /usr/share/apache-* \
            /usr/share/az_* \
            /usr/share/doc/* \
            /usr/share/fonts/* \
            /usr/share/gradle-* \
            /usr/share/icons/* \
            /usr/share/info/* \
            /usr/share/kotlinc \
            /usr/share/java \
            /usr/share/man/* \
            /usr/share/miniconda \
            /usr/share/sbt \
            /usr/share/swift \
            /usr/share/tcltk \
            /usr/share/texinfo \
            /var/lib/gems \
            /var/lib/mysql \
            /var/lib/ubuntu-advantage
          echo "Rampage complete" > "${expansion_dir}/rampage_done"
        fi

        # Claim the space that the Docker, apt, and later rmz work freed
        if [[ "${protocol_level}" -ge 2 ]]; then
          echo "The Purge Is Complete!" > "${expansion_dir}/purge_done"
          add_expansion_disk
        fi

        echo "Everything completed" > "${expansion_dir}/all_done"
        EOF

        # Make script executable
        chmod +x /tmp/expand_nix_volume.sh
        echo "${{ steps.set-hatchet-protocol.outputs.name }}" > "${HOME}/.expansion/protocol"

        # Time the purge. The post step reads purge_seconds, which appears
        # when the purge exits, and all_done, which appears only on success.
        function timed_purge() {
          local purge_start
          local purge_status=0
          purge_start=$(date +%s)
          /tmp/expand_nix_volume.sh || purge_status=$?
          echo "$(( $(date +%s) - purge_start ))" > "${HOME}/.expansion/purge_seconds"
          return "${purge_status}"
        }

        # Execute based on witness-carnage setting
        if [ "${{ inputs.witness-carnage }}" == "true" ]; then
          echo "😮 Displaying the carnage in real-time. This will block until completion."
          timed_purge | tee "${HOME}/.expansion/expansion.log"
          purge_seconds=$(cat "${HOME}/.expansion/purge_seconds")
          echo "⏱️  The purge took ${purge_seconds} seconds"
          echo "purge-seconds=${purge_seconds}" >> "${GITHUB_OUTPUT}"
        else
          timed_purge > "${HOME}/.expansion/expansion.log" 2>&1 &
          echo "📈 Background space expansion started. /nix will grow as space becomes available."
        fi

        read -r nix_size_bytes nix_avail_bytes < <(df -B1 --output=size,avail /nix | tail -n 1)
        echo "Size of /nix: ${nix_size_bytes} bytes, available: ${nix_avail_bytes} bytes"
        echo "nix-size-bytes=${nix_size_bytes}" >> "${GITHUB_OUTPUT}"
        echo "nix-avail-bytes=${nix_avail_bytes}" >> "${GITHUB_OUTPUT}"
    - name: The Post
      if: runner.os == 'Linux' && steps.environment-check.outputs.is_supported == 'true'
      # v3
      uses: srz-zumix/post-run-action@42756f7452b9439d0365b7e087b2c364f54209c6
      with:
        shell: bash -e {0}
        post-run: |
          expansion_dir="${HOME}/.expansion"
          protocol=$(cat "${expansion_dir}/protocol" 2>/dev/null || echo "unknown")
          runner_desc="$(lsb_release -ds 2>/dev/null || echo "${RUNNER_OS}") $(uname -m)"
          nix_size="n/a"
          nix_avail="n/a"
          if findmnt -n --mountpoint /nix > /dev/null &&
            read -r nix_size_bytes nix_avail_bytes < <(df -B1 --output=size,avail /nix | tail -n +2); then
            nix_size=$(awk -v b="${nix_size_bytes}" 'BEGIN { printf "%.1f GiB", b / 1073741824 }')
            nix_avail=$(awk -v b="${nix_avail_bytes}" 'BEGIN { printf "%.1f GiB", b / 1073741824 }')
          fi
          root_free="n/a"
          root_free_bytes=$(df -B1 --output=avail / | tail -n 1 | tr -d ' ' || true)
          if [[ "${root_free_bytes}" =~ ^[0-9]+$ ]]; then
            root_free=$(awk -v b="${root_free_bytes}" 'BEGIN { printf "%.1f GiB", b / 1073741824 }')
          fi
          purge_seconds=$(cat "${expansion_dir}/purge_seconds" 2>/dev/null || echo "n/a")
          if [[ -e "${expansion_dir}/all_done" ]]; then
            purge_finished="yes"
          elif [[ -e "${expansion_dir}/purge_seconds" ]]; then
            purge_finished="no, failed"
          else
            purge_finished="no, still running"
          fi
          echo "Protocol: ${protocol}, runner: ${runner_desc}, /nix size: ${nix_size}, /nix available: ${nix_avail}, / free: ${root_free}, purge seconds: ${purge_seconds}, purge finished: ${purge_finished}"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "| Protocol | Runner | /nix size | /nix available | / free | Purge seconds | Purge finished |"
              echo "| --- | --- | --- | --- | --- | --- | --- |"
              echo "| ${protocol} | ${runner_desc} | ${nix_size} | ${nix_avail} | ${root_free} | ${purge_seconds} | ${purge_finished} |"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          # The workspace, caches, and toolchains still write to /, and
          # the root safe haven is all that the purge leaves there.
          if [[ "${root_free_bytes}" =~ ^[0-9]+$ && "${root_free_bytes}" -lt 1073741824 ]]; then
            echo "::warning::/ has less than 1 GiB free at the end of the job (${root_free_bytes} bytes). Raise root-safe-haven to keep more space on /."
          fi

          # The protocol file exists only when the purge started.
          if [[ -e "${expansion_dir}/protocol" && "${purge_finished}" != "yes" ]]; then
            if [[ "${purge_finished}" == "no, failed" ]]; then
              echo "::warning::The ${protocol} purge failed, so /nix did not get all of the freed space. See the end of expansion.log below."
            else
              echo "::warning::The ${protocol} purge did not finish before the job ended, so /nix did not get all of the freed space. See the end of expansion.log below."
            fi
            echo "Last 50 lines of ${expansion_dir}/expansion.log:"
            tail -n 50 "${expansion_dir}/expansion.log" 2>/dev/null || echo "expansion.log not found"
          fi

          ls -ltr "${expansion_dir}"/*_done || true
          all_disks=()

          # Check for disks in /mnt directory
          mnt_disks=(/mnt/disk*.img)
          if [[ -e "${mnt_disks[0]}" ]]; then
            all_disks+=("${mnt_disks[@]}")
          fi

          # Check for disks in / directory
          root_disks=(/disk*.img)
          if [[ -e "${root_disks[0]}" ]]; then
            all_disks+=("${root_disks[@]}")
          fi

          echo "Found ${#all_disks[@]} disk image(s):"
          for disk in "${all_disks[@]}"; do
            echo "- $disk ($(du -h "$disk" | cut -f1))"
          done
          echo "Space used by TMPDIR (${TMPDIR}):"
          sudo du -csh "${TMPDIR}" 2>/dev/null || echo "TMPDIR not found or empty"
          echo "Space used by disk images:"
          sudo df -h
          echo "Check which device(s) btrfs is using:"
          sudo btrfs filesystem show /nix
          echo "See actual allocation per device:"
          sudo btrfs device stats /nix
